# ══════════════════════════════════════════════════════════════
# Nginx Reverse Proxy + Load Balancer — MiniDrive
# ══════════════════════════════════════════════════════════════
#
# Architecture:
#   Client → Nginx (:80) → API Server pool (:3000, :3001)
#                        → Metadata Service (:4000)
#                        → Frontend (:5173 dev / static in prod)
#
# Features:
#   - Round-robin load balancing across API servers
#   - Sticky sessions via IP hash (for JWT refresh consistency)
#   - Connection limiting & rate limiting
#   - Gzip compression
#   - Security headers
#   - File upload size (100MB)
#   - WebSocket support (for Vite HMR in dev)
#
# Usage:
#   nginx -c /path/to/nginx.conf
#   (Or symlink into /etc/nginx/sites-enabled/)
# ══════════════════════════════════════════════════════════════

worker_processes auto;
error_log logs/error.log warn;
pid       logs/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time';

    access_log logs/access.log main;

    # ── Performance ───────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ── Gzip Compression ─────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── File Upload Size ─────────────────────────────────────
    client_max_body_size 100m;

    # ── Rate Limiting Zones ──────────────────────────────────
    # General API: 10 req/sec per IP (burst 20)
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    # Auth endpoints: 5 req/sec per IP (prevent brute force)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    # Upload endpoints: 2 req/sec per IP
    limit_req_zone $binary_remote_addr zone=upload:10m rate=2r/s;

    # ── Connection Limiting ──────────────────────────────────
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    # ══════════════════════════════════════════════════════════
    # UPSTREAM — API Server Pool (load balanced)
    # ══════════════════════════════════════════════════════════
    upstream api_servers {
        # ip_hash ensures same client hits same server
        # (important for in-memory JWT token state)
        ip_hash;

        server 127.0.0.1:3000;
        server 127.0.0.1:3001;
        # Add more API server instances as needed:
        # server 127.0.0.1:3002;

        keepalive 32;
    }

    # ── Metadata Service (single instance) ────────────────────
    upstream metadata_service {
        server 127.0.0.1:4000;
        keepalive 16;
    }

    # ── Frontend dev server ───────────────────────────────────
    upstream frontend_dev {
        server 127.0.0.1:5173;
    }

    # ══════════════════════════════════════════════════════════
    # SERVER BLOCK
    # ══════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name localhost minidrive.local;

        # ── Security Headers ─────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Connection Limit ─────────────────────────────────
        limit_conn perip 50;

        # ── API Routes (load balanced) ───────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://api_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Timeouts for large file uploads
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # ── Auth Routes (stricter rate limit) ────────────────
        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;

            proxy_pass http://api_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # ── Upload Routes (upload rate limit) ────────────────
        location /api/files/upload {
            limit_req zone=upload burst=5 nodelay;

            proxy_pass http://api_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Extended timeout for large uploads
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }

        # ── Metadata Service Routes ──────────────────────────
        location /metadata/ {
            proxy_pass http://metadata_service/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
        }

        # ── Health Check (bypass load balancer) ──────────────
        location /health {
            proxy_pass http://api_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ── Frontend (dev mode: proxy to Vite) ───────────────
        # In production, replace with static file serving:
        #   location / {
        #       root /path/to/frontend/dist;
        #       try_files $uri $uri/ /index.html;
        #   }
        location / {
            proxy_pass http://frontend_dev;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ── Error Pages ──────────────────────────────────────
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            default_type application/json;
            return 502 '{"success":false,"error":{"message":"Service temporarily unavailable"}}';
        }

        # ── Rate Limit Error ─────────────────────────────────
        error_page 429 /429.json;
        location = /429.json {
            default_type application/json;
            return 429 '{"success":false,"error":{"message":"Too many requests. Please slow down."}}';
        }
    }
}
