worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile    on;
    tcp_nopush  on;
    gzip        on;
    gzip_types  text/plain text/css application/json application/javascript
                text/xml application/xml application/xml+rss text/javascript;

    # ── API server pool ───────────────────────────────────────
    upstream api_servers {
        ip_hash;  # Sticky sessions for JWT refresh tokens
        server api-1:3000;
        server api-2:3000;
    }

    # ── Rate limiting zones ───────────────────────────────────
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=100r/m;

    server {
        listen 80;
        server_name _;

        client_max_body_size 100M;

        # ── Security headers ─────────────────────────────────
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # ── Auth API (stricter rate limit) ────────────────────
        location /api/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://api_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── File uploads (medium rate limit, long timeout) ────
        location /api/files/upload {
            limit_req zone=upload_limit burst=10 nodelay;
            proxy_pass http://api_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ── General API ──────────────────────────────────────
        location /api/ {
            limit_req zone=general_limit burst=20 nodelay;
            proxy_pass http://api_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Metadata service (internal, but exposed for health) ─
        location /metadata/ {
            proxy_pass http://metadata:4000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Frontend (SPA) ────────────────────────────────────
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Error pages ──────────────────────────────────────
        error_page 502 503 504 /50x.json;
        location = /50x.json {
            default_type application/json;
            return 502 '{"success":false,"error":"Service temporarily unavailable. Please try again."}';
        }

        error_page 429 /429.json;
        location = /429.json {
            default_type application/json;
            return 429 '{"success":false,"error":"Too many requests. Please slow down."}';
        }
    }
}
